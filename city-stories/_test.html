<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#9cc7ee}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script></head><body>
<script type="module">
import * as THREE from 'three';
import { loadHero, Character } from './js/rig.js';
import { loadVehicles, makeKarachiVehicle } from './js/vehicles.js';
const R=new THREE.WebGLRenderer({antialias:true}); R.setSize(1280,720); R.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(R.domElement);
const S=new THREE.Scene(); S.background=new THREE.Color(0x9cc7ee);
S.add(new THREE.HemisphereLight(0xdfeeff,0x6b6250,1.6)); const sun=new THREE.DirectionalLight(0xfff2dc,2.4); sun.position.set(5,10,8); S.add(sun);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshLambertMaterial({color:0x8a8f86})); gr.rotation.x=-Math.PI/2; S.add(gr);
const cam=new THREE.PerspectiveCamera(40,1280/720,.1,200);
const q=new URLSearchParams(location.search), mode=q.get('m')||'chars', t=+(q.get('t')||0.3);
await loadHero(); await loadVehicles();
const chars=[];
if(mode==='chars'){
  const list=[{hero:true},{hero:true},{shirt:0xc8326b,pants:0x283044,skin:0xb98260,long:true,fem:true,bag:0x5a3a7a,scale:.93},{hijab:0x3a2a4a,shirt:0x5a2030,pants:0x2a2230,fem:true,sleeve:1,skin:0xc99a74},{shirt:0x2f5d3a,pants:0x3a3f4a,skin:0xe0b89a,hair:0x8a6a3a},{shirt:0xf2f2ee,pants:0x1c2540,skin:0x6a4a34}];
  list.forEach((st,i)=>{ const c=new Character(st); c.g.position.set((i-2.5)*1.1,0,0); S.add(c.g); chars.push([c,i==1?{speed:5,run:true}:i==4?{speed:2.9}:i==3?{talk:true}:{}]); });
  cam.position.set(0,1.4,7); cam.lookAt(0,1,0);
  if(q.get('z')){ const x=+q.get('z'); cam.position.set(x,1.6,1.2); cam.lookAt(x,1.5,0); }
} else {
  ['papurola','mehran','amb','truck','moto'].forEach((k,i)=>{ const v=makeKarachiVehicle(k); v.position.set((i-2)*3.3,0,0); v.rotation.y=.6; S.add(v); });
  const c=new Character({hero:true}); c.g.position.set(5.6,0,-2.5); S.add(c.g); chars.push([c,{}]);
  cam.position.set(0,5,14); cam.lookAt(0,1,0);
}
await new Promise(r=>setTimeout(r,800));
let T=0; for(let k=0;k<Math.round(t*60);k++){ for(const [c,st] of chars){ c.animate(1/60,st); if(st.speed) c.g.position.z+=0; } }
R.render(S,cam); window.done=true;
</script></body></html>
